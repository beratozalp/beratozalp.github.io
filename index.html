<title>Berat Store</title>
<style>
:root{--bg:#f5f5f7;--surface:#fff;--text:#1d1d1f;--muted:#777;--border:#e5e5e5;--blue:#087cff;--shadow:0 8px 30px #0000000c}
body.dark{--bg:#151515;--surface:#222;--text:#f5f5f7;--muted:#aaa;--border:#383838;--shadow:0 8px 30px #0005}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;transition:.2s}
header{height:70px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 7%;position:sticky;top:0;z-index:10}
.logo{font-size:24px;font-weight:800;color:var(--text);text-decoration:none;letter-spacing:-1px}
nav{display:flex;gap:25px;align-items:center}
nav a{color:var(--text);text-decoration:none;font-size:14px}
button{cursor:pointer;font-family:inherit}
.theme{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:9px 13px;border-radius:20px}
.hero{text-align:center;padding:75px 20px 55px}
.hero h1{font-size:clamp(34px,6vw,58px);letter-spacing:-2px;margin:0 0 15px}
.hero p{color:var(--muted);font-size:17px;margin:0}
.container{max-width:1250px;margin:auto;padding:25px 22px 70px}
.section-title{font-size:28px;letter-spacing:-1px;margin:0 0 8px}
.section-subtitle{color:var(--muted);margin:0 0 25px}
.search-wrap{position:relative;max-width:650px;margin-bottom:22px}
#search{width:100%;padding:17px 20px;border:1px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:16px;outline:none}
#search:focus{border-color:var(--blue);box-shadow:0 0 0 3px #087cff18}
.suggestions{display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:8;overflow:hidden;max-height:350px;overflow-y:auto}
.suggestions.show{display:block}
.suggestion{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--border)}
.suggestion:hover{background:var(--bg)}
.suggestion small{display:block;color:var(--muted);margin-top:3px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.filter{padding:9px 16px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:22px;font-size:14px}
.filter.active{background:var(--blue);color:white;border-color:var(--blue)}
.result-info{color:var(--muted);font-size:14px;margin:20px 0}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.game-card{background:var(--surface);border:1px solid var(--border);border-radius:15px;overflow:hidden;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.game-card:hover{transform:translateY(-5px);box-shadow:0 12px 30px #0002}
.game-card img{width:100%;aspect-ratio:460/215;object-fit:cover;display:block;background:#333}
.card-content{padding:15px}
.card-content h3{font-size:17px;margin:0 0 8px}
.card-content p{font-size:13px;color:var(--muted);margin:0}
.tag{display:inline-block;margin-top:12px;padding:5px 9px;background:var(--bg);border-radius:15px;font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:50px;color:var(--muted);display:none}
footer{text-align:center;padding:30px;color:var(--muted);border-top:1px solid var(--border);font-size:13px}
.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}
.overlay.show{display:flex}
.modal{background:var(--surface);color:var(--text);width:100%;max-width:650px;max-height:90vh;overflow:auto;border-radius:18px;position:relative}
.modal img{width:100%;aspect-ratio:460/215;object-fit:cover;display:block}
.modal-body{padding:24px}
.modal h2{font-size:27px;margin:8px 0}
.modal p{color:var(--muted);line-height:1.6}
.modal-info{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:20px 0}
.modal-info div{background:var(--bg);padding:12px;border-radius:10px;font-size:13px}
.modal-info strong{display:block;margin-bottom:5px}
.modal-link{display:inline-block;background:var(--blue);color:white;text-decoration:none;padding:12px 18px;border-radius:10px}
.close{position:absolute;right:13px;top:13px;border:0;border-radius:50%;width:36px;height:36px;background:#0009;color:white;font-size:22px}
@media(max-width:950px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:650px){header{padding:0 18px}nav{gap:12px}nav a{font-size:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card-content{padding:11px}.card-content h3{font-size:14px}.hero{padding:55px 15px 40px}}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style>
</head>

const categories=[
["all","Tümü"],["action","Aksiyon"],["adventure","Macera"],
["racing","Yarış"],["simulation","Simülasyon"],["sandbox","Sandbox"]
];

const descriptions={
action:"Aksiyon ve macera dolu bir oyun deneyimi sunar.",
adventure:"Keşif, hikâye ve macera odaklı bir oyun.",
racing:"Hız, araçlar ve yarış heyecanı sunan bir oyun.",
simulation:"Gerçekçi sistemleri ve farklı deneyimleri simüle eder.",
sandbox:"Özgürce keşfedebileceğin ve kendi dünyanı oluşturabileceğin bir oyun."
};

const games=rawGames.map(g=>({
name:g[0],category:g[1],aliases:g[2],developer:g[3],
year:g[4],platform:g[5],genre:g[6],steam:g[7],url:g[8],
description:descriptions[g[1]] || "Eğlenceli bir oyun deneyimi sunar.",
image:g[7] ? `https://cdn.cloudflare.steamstatic.com/steam/apps/${g[7]}/header.jpg` : ""
}));

function normalize(value){
return String(value ?? "").toLocaleLowerCase("tr-TR")
.replace(/ı/g,"i").replace(/ğ/g,"g").replace(/ü/g,"u")
.replace(/ş/g,"s").replace(/ö/g,"o").replace(/ç/g,"c")
.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
}

function searchableText(game){
return normalize([
game.name,game.aliases,game.category,game.developer,
game.genre,game.platform,game.year,game.description
].join(" "));
}

const grid=document.getElementById("grid");
const search=document.getElementById("search");
const suggestions=document.getElementById("suggestions");
const filters=document.getElementById("filters");
const resultInfo=document.getElementById("resultInfo");
const empty=document.getElementById("empty");
const overlay=document.getElementById("overlay");

let activeCategory="all";

function getFilteredGames(){
const words=normalize(search.value).trim().split(/\s+/).filter(Boolean);
return games.filter(game=>{
const categoryMatch=activeCategory==="all"||game.category===activeCategory;
const text=searchableText(game);
const searchMatch=words.every(word=>text.includes(word));
return categoryMatch&&searchMatch;
});
}

function renderFilters(){
filters.innerHTML="";
categories.forEach(([id,label])=>{
const button=document.createElement("button");
button.className="filter"+(activeCategory===id?" active":"");
button.textContent=label;
button.addEventListener("click",()=>{
activeCategory=id;
renderFilters();
render();
updateSuggestions();
});
filters.appendChild(button);
});
}

function render(){
const filtered=getFilteredGames();
grid.innerHTML="";
resultInfo.textContent=`${filtered.length} oyun gösteriliyor / Toplam ${games.length} oyun`;

filtered.forEach(game=>{
const card=document.createElement("article");
card.className="game-card";
card.tabIndex=0;

const img=document.createElement("img");
img.src=game.image || "https://placehold.co/460x215/222/fff?text=Berat+Store";
img.alt=game.name;
img.loading="lazy";
img.onerror=()=>{img.src="https://placehold.co/460x215/222/fff?text=Berat+Store";};

const content=document.createElement("div");
content.className="card-content";

const title=document.createElement("h3");
title.textContent=game.name;

const developer=document.createElement("p");
developer.textContent=game.developer;

const tag=document.createElement("span");
tag.className="tag";
tag.textContent=categories.find(c=>c[0]===game.category)?.[1]||game.category;

content.append(title,developer,tag);
card.append(img,content);
card.addEventListener("click",()=>showGame(game));
card.addEventListener("keydown",e=>{
if(e.key==="Enter"||e.key===" "){e.preventDefault();showGame(game);}
});
grid.appendChild(card);
});

empty.style.display=filtered.length?"none":"block";
}

function updateSuggestions(){
const query=normalize(search.value).trim();
suggestions.innerHTML="";
if(!query){suggestions.classList.remove("show");return;}

const words=query.split(/\s+/);
const matches=games.filter(game=>{
const text=searchableText(game);
return words.every(word=>text.includes(word));
}).slice(0,10);

if(!matches.length){
suggestions.classList.remove("show");
return;
}

matches.forEach(game=>{
const item=document.createElement("div");
item.className="suggestion";
const name=document.createElement("strong");
name.textContent=game.name;
const detail=document.createElement("small");
detail.textContent=game.developer+" • "+game.year;
item.append(name,detail);
item.addEventListener("click",()=>{
search.value=game.name;
activeCategory="all";
renderFilters();
render();
suggestions.classList.remove("show");
showGame(game);
});
suggestions.appendChild(item);
});
suggestions.classList.add("show");
}

function showGame(game){
document.getElementById("modalImage").src=game.image||"https://placehold.co/460x215/222/fff?text=Berat+Store";
document.getElementById("modalTitle").textContent=game.name;
document.getElementById("modalCategory").textContent=categories.find(c=>c[0]===game.category)?.[1]||game.category;
document.getElementById("modalDescription").textContent=game.description;
document.getElementById("modalDeveloper").textContent=game.developer;
document.getElementById("modalYear").textContent=game.year;
document.getElementById("modalPlatform").textContent=game.platform;
document.getElementById("modalGenre").textContent=game.genre;
document.getElementById("modalLink").href=game.url;
overlay.classList.add("show");
document.body.style.overflow="hidden";
}

function closeModal(){
overlay.classList.remove("show");
document.body.style.overflow="";
}

search.addEventListener("input",()=>{
render();
updateSuggestions();
});

search.addEventListener("keydown",e=>{
if(e.key==="Enter"){
const first=getFilteredGames()[0];
if(first){showGame(first);suggestions.classList.remove("show");}
}
if(e.key==="Escape")suggestions.classList.remove("show");
});

document.addEventListener("click",e=>{
if(!e.target.closest(".search-wrap"))suggestions.classList.remove("show");
});

document.getElementById("close").addEventListener("click",closeModal);
overlay.addEventListener("click",e=>{
if(e.target===overlay)closeModal();
});

document.addEventListener("keydown",e=>{
if(e.key==="Escape")closeModal();
});

const themeButton=document.getElementById("themeButton");

function setTheme(theme){
document.body.classList.toggle("dark",theme==="dark");
themeButton.textContent=theme==="dark"?"☀️ Tema":"🌙 Tema";
try{localStorage.setItem("beratTheme",theme);}catch(e){}
}

try{
setTheme(localStorage.getItem("beratTheme")==="dark"?"dark":"light");
}catch(e){
setTheme("light");
}

themeButton.addEventListener("click",()=>{
setTheme(document.body.classList.contains("dark")?"light":"dark");
});

renderFilters();
render();
</script>
