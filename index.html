<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berat Store</title>

<style>
:root {
    --bg:#f5f5f7;
    --surface:#fff;
    --text:#1d1d1f;
    --muted:#777;
    --border:#e5e5e5;
    --blue:#0878ed;
    --soft:#eeeeF2;
}

body.dark {
    --bg:#151515;
    --surface:#222;
    --text:#f5f5f7;
    --muted:#aaa;
    --border:#393939;
    --soft:#303030;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:Arial, sans-serif;
    transition:.2s;
}

header {
    height:65px;
    padding:0 7%;
    background:var(--surface);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
}

.logo {
    font-size:23px;
    font-weight:800;
    color:var(--text);
    text-decoration:none;
}

.logo span {
    color:var(--blue);
}

nav {
    display:flex;
    align-items:center;
    gap:20px;
}

nav a {
    color:var(--text);
    text-decoration:none;
    font-size:13px;
}

.theme {
    background:var(--soft);
    color:var(--text);
    border:1px solid var(--border);
    padding:9px 13px;
    border-radius:20px;
    cursor:pointer;
}

.hero {
    padding:85px 7% 65px;
}

.hero small {
    color:var(--blue);
    letter-spacing:2px;
    font-weight:bold;
}

.hero h1 {
    font-size:clamp(42px,7vw,75px);
    letter-spacing:-4px;
    margin-top:18px;
}

.hero p {
    color:var(--muted);
    margin-top:20px;
    line-height:1.8;
}

.library {
    padding:30px 7% 90px;
}

.top {
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:25px;
}

.top h2 {
    font-size:27px;
}

.search-box {
    position:relative;
    width:min(380px,100%);
}

.search {
    width:100%;
    height:46px;
    padding:0 15px;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
    background:var(--surface);
    color:var(--text);
    font-size:14px;
}

.search:focus {
    border-color:var(--blue);
}

.suggestions {
    display:none;
    position:absolute;
    top:53px;
    left:0;
    right:0;
    max-height:300px;
    overflow-y:auto;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:9px;
    box-shadow:0 10px 30px #0002;
    z-index:20;
}

.suggestion {
    padding:13px 15px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    font-size:13px;
}

.suggestion:hover {
    background:var(--soft);
}

.suggestion small {
    display:block;
    color:var(--muted);
    margin-top:5px;
}

.no-suggestion {
    padding:15px;
    color:var(--muted);
    font-size:13px;
}

.filters {
    display:flex;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.filters button {
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 16px;
    border-radius:25px;
    cursor:pointer;
}

.filters button.active {
    background:var(--text);
    color:var(--bg);
    border-color:var(--text);
}

.result-info {
    color:var(--muted);
    font-size:12px;
    margin-bottom:18px;
}

.grid {
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:22px;
}

.game {
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:11px;
    overflow:hidden;
    transition:.2s;
}

.game:hover {
    transform:translateY(-4px);
    box-shadow:0 12px 30px #0002;
}

.game img {
    width:100%;
    height:185px;
    object-fit:cover;
    background:var(--soft);
    display:block;
}

.game-info {
    padding:17px;
}

.category {
    color:var(--blue);
    font-size:10px;
    font-weight:bold;
    text-transform:uppercase;
    letter-spacing:1px;
}

.game h3 {
    margin-top:9px;
    font-size:18px;
}

.game p {
    margin-top:9px;
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
    min-height:40px;
}

.game-bottom {
    margin-top:15px;
    padding-top:13px;
    border-top:1px solid var(--border);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:8px;
}

.game-bottom span {
    color:var(--muted);
    font-size:11px;
}

.game-bottom button,
.official {
    background:var(--blue);
    color:white;
    border:0;
    padding:10px 14px;
    border-radius:5px;
    cursor:pointer;
    text-decoration:none;
    font-size:12px;
}

.empty {
    display:none;
    text-align:center;
    padding:60px 10px;
    color:var(--muted);
}

.overlay {
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    background:#000a;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.overlay.show {
    display:flex;
}

.modal {
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow-y:auto;
    position:relative;
    background:var(--surface);
    border-radius:12px;
}

.modal-cover {
    width:100%;
    height:250px;
    object-fit:cover;
    display:block;
    background:var(--soft);
}

.close {
    position:absolute;
    top:12px;
    right:12px;
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:white;
    color:#111;
    font-size:22px;
    cursor:pointer;
}

.modal-content {
    padding:25px;
}

.modal-content h2 {
    margin:10px 0;
    font-size:28px;
}

.modal-content p {
    color:var(--muted);
    font-size:14px;
    line-height:1.8;
}

.details {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin:22px 0;
}

.detail {
    background:var(--soft);
    padding:14px;
    border-radius:7px;
}

.detail small {
    display:block;
    color:var(--muted);
    margin-bottom:7px;
    font-size:10px;
}

.detail strong {
    font-size:13px;
}

.modal-actions {
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.modal-actions button {
    background:var(--soft);
    color:var(--text);
    border:0;
    padding:11px 17px;
    border-radius:5px;
    cursor:pointer;
}

footer {
    border-top:1px solid var(--border);
    padding:25px 7%;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
}

@media(max-width:900px) {
    .grid {
        grid-template-columns:repeat(2,minmax(0,1fr));
    }
}

@media(max-width:600px) {
    header {
        padding:0 5%;
    }

    nav {
        gap:10px;
    }

    nav a {
        font-size:11px;
    }

    .logo {
        font-size:19px;
    }

    .theme {
        font-size:10px;
        padding:8px;
    }

    .hero {
        padding:60px 6%;
    }

    .library {
        padding:25px 6% 65px;
    }

    .grid {
        grid-template-columns:1fr;
    }

    .game img {
        height:210px;
    }

    .search-box {
        width:100%;
    }

    .modal-cover {
        height:190px;
    }
}
</style>
</head>

                    Resmî sayfa ↗
                </a>
                <button id="back">Kapat</button>
            </div>
        </div>
    </div>
</div>

<footer>
    <span>Berat Store.</span>
    <span>© 2026</span>
</footer>

url:"https://store.steampowered.com/app/346010/"
}
];


/* ARAMA VE FİLTRE SİSTEMİ */

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const suggestions = document.getElementById("suggestions");
const empty = document.getElementById("empty");
const filters = document.getElementById("filters");
const resultInfo = document.getElementById("resultInfo");

let activeCategory = "all";

function normalize(text) {
    return String(text)
        .toLocaleLowerCase("tr-TR")
        .replace(/ı/g,"i")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}

function searchableText(game) {
    return normalize([
        game.name,
        game.aliases,
        game.categoryName,
        game.description,
        game.developer,
        game.genre,
        game.platform
    ].join(" "));
}

function getFilteredGames() {
    const query = normalize(search.value);
    const words = query.split(/\s+/).filter(Boolean);

    return games.filter(game => {
        const matchesWords = words.every(word =>
            searchableText(game).includes(word)
        );

        const matchesCategory =
            activeCategory === "all" ||
            game.category === activeCategory;

        return matchesWords && matchesCategory;
    });
}


/* KATEGORİLERİ OLUŞTUR */

const categories = [
    ["all","Tümü"],
    ["action","Aksiyon"],
    ["adventure","Macera"],
    ["racing","Yarış"],
    ["simulation","Simülasyon"],
    ["sandbox","Sandbox"]
];

categories.forEach(([value,label]) => {
    const button = document.createElement("button");
    button.textContent = label;
    button.dataset.category = value;

    if (value === "all") button.classList.add("active");

    button.addEventListener("click", () => {
        activeCategory = value;

        filters.querySelectorAll("button").forEach(item => {
            item.classList.toggle(
                "active",
                item.dataset.category === value
            );
        });

        render();
        updateSuggestions();
    });

    filters.appendChild(button);
});


/* OYUN KARTLARINI GÖSTER */

function render() {
    const filtered = getFilteredGames();

    grid.innerHTML = "";

    resultInfo.textContent =
        filtered.length + " oyun gösteriliyor / " + games.length + " oyun";

    filtered.forEach(game => {
        const card = document.createElement("article");
        card.className = "game";

        const img = document.createElement("img");
        img.src = game.image;
        img.alt = game.name;
        img.loading = "lazy";

        const info = document.createElement("div");
        info.className = "game-info";

        const category = document.createElement("span");
        category.className = "category";
        category.textContent = game.categoryName;

        const title = document.createElement("h3");
        title.textContent = game.name;

        const description = document.createElement("p");
        description.textContent = game.description;

        const bottom = document.createElement("div");
        bottom.className = "game-bottom";

        const platform = document.createElement("span");
        platform.textContent = game.platform;

        const button = document.createElement("button");
        button.textContent = "İncele ↗";
        button.addEventListener("click", () => showGame(game));

        bottom.append(platform,button);
        info.append(category,title,description,bottom);
        card.append(img,info);
        grid.appendChild(card);
    });

    empty.style.display = filtered.length ? "none" : "block";
}


/* ARAMA ÖNERİLERİ */

function updateSuggestions() {
    const query = normalize(search.value);

    suggestions.innerHTML = "";

    if (!query) {
        suggestions.style.display = "none";
        return;
    }

    const words = query.split(/\s+/).filter(Boolean);

    const results = games.filter(game =>
        words.every(word => searchableText(game).includes(word))
    );

    if (results.length === 0) {
        const message = document.createElement("div");
        message.className = "no-suggestion";
        message.textContent = "Oyun bulunamadı.";
        suggestions.appendChild(message);
    } else {
        results.slice(0,10).forEach(game => {
            const item = document.createElement("div");
            item.className = "suggestion";

            const title = document.createElement("strong");
            title.textContent = game.name;

            const detail = document.createElement("small");
            detail.textContent = game.categoryName + " • " + game.developer;

            item.append(title,detail);

            item.addEventListener("click", () => {
                search.value = game.name;
                activeCategory = "all";

                filters.querySelectorAll("button").forEach(button => {
                    button.classList.toggle(
                        "active",
                        button.dataset.category === "all"
                    );
                });

                render();
                suggestions.style.display = "none";
                showGame(game);
            });

            suggestions.appendChild(item);
        });
    }

    suggestions.style.display = "block";
}


/* ARAMA KUTUSU */

search.addEventListener("input", () => {
    render();
    updateSuggestions();
});

search.addEventListener("keydown", event => {
    if (event.key === "Enter") {
        const first = getFilteredGames()[0];

        if (first) {
            suggestions.style.display = "none";
            showGame(first);
        }
    }

    if (event.key === "Escape") {
        suggestions.style.display = "none";
    }
});

document.addEventListener("click", event => {
    if (!event.target.closest(".search-box")) {
        suggestions.style.display = "none";
    }
});


/* OYUN DETAY PENCERESİ */

const overlay = document.getElementById("overlay");

function showGame(game) {
    document.getElementById("modalImage").src = game.image;
    document.getElementById("modalImage").alt = game.name;
    document.getElementById("modalCategory").textContent = game.categoryName;
    document.getElementById("modalTitle").textContent = game.name;
    document.getElementById("modalDescription").textContent = game.description;
    document.getElementById("modalDeveloper").textContent = game.developer;
    document.getElementById("modalYear").textContent = game.year;
    document.getElementById("modalPlatform").textContent = game.platform;
    document.getElementById("modalGenre").textContent = game.genre;
    document.getElementById("modalLink").href = game.url;

    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
}

function closeModal() {
    overlay.classList.remove("show");
    document.body.style.overflow = "";
}

document.getElementById("close").addEventListener("click",closeModal);
document.getElementById("back").addEventListener("click",closeModal);

overlay.addEventListener("click",event => {
    if (event.target === overlay) closeModal();
});

document.addEventListener("keydown",event => {
    if (event.key === "Escape") closeModal();
});


/* KOYU / AYDINLIK TEMA */

const themeButton = document.getElementById("themeButton");

let savedTheme = "light";

try {
    savedTheme = localStorage.getItem("beratTheme") || "light";
} catch(error) {}

function setTheme(theme) {
    document.body.classList.toggle("dark",theme === "dark");

    themeButton.textContent =
        theme === "dark" ? "☀ Aydınlık Tema" : "☾ Koyu Tema";

    try {
        localStorage.setItem("beratTheme",theme);
    } catch(error) {}
}

setTheme(savedTheme);

themeButton.addEventListener("click",() => {
    const nextTheme = document.body.classList.contains("dark")
        ? "light"
        : "dark";

    setTheme(nextTheme);
});


/* İLK AÇILIŞ */

render();

</script>

</body>
</html>
